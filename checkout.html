<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — Shugarlee Collectibles</title>
  <meta name="description" content="Complete your Shugarlee order — nationwide delivery in 2–5 working days, free over ₦200,000. Card, transfer or pay on delivery.">
  <meta name="theme-color" content="#fff2df">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="Glossy Shugarlee Script Logo.png">
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.className = "js";</script>
</head>
<body>

<main id="main" data-page="checkout">
  <section class="page-hero">
    <span class="page-hero__veil" aria-hidden="true"></span>
    <span class="doodle page-hero__doodle --a" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#d-star"></use></svg></span>
    <span class="doodle page-hero__doodle --b" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#d-heart"></use></svg></span>
    <div class="page-hero__inner">
      <span class="page-hero__kicker hand">almost yours</span>
      <h1 class="page-hero__title" data-split>Checkout</h1>
      <p class="page-hero__sub">confirm your pieces and we will call you right back</p>
    </div>
  </section>

  <div class="checkout__wrap js-checkout-wrap"></div>
</main>

<script src="js/vendor/gsap.min.js"></script>
<script src="js/vendor/ScrollTrigger.min.js"></script>
<script src="js/vendor/lenis.min.js"></script>
<script src="js/products.js"></script>
<script src="js/chrome.js"></script>
<script src="js/product-template.js"></script>
<script src="js/main.js"></script>
</body>
</html>
